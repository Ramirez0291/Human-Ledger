# 使用前先复制环境变量文件：cp .env.example .env
# 生产部署务必在 .env 中设置 SECRET_KEY，否则服务会拒绝启动。
name: renlei-zhangben
services:
  app:
    build: .
    container_name: renlei-zhangben
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内固定路径，与 volume 挂载点一致
      DATA_DIR: /app/data
    volumes:
      # SQLite 数据库与上传的截图，不挂载则容器重建即丢数据
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
